[workspace]
members = ["clients/rust", "clients/rustler"]
default-members = ["."]
resolver = "2"

[package]
name = "h3-hrx"
version = "0.1.0"
edition = "2021"
description = "MiniMax H3 video and audio generation on AMD Strix Halo, powered by Loom and HRX"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/zacharydenton/h3-hrx"
homepage = "https://github.com/zacharydenton/h3-hrx"
keywords = ["loom", "hrx", "minimax", "video-generation", "strix-halo"]
categories = ["science", "multimedia::video", "multimedia::audio", "command-line-utilities"]
default-run = "h3"
exclude = ["/clients", "/experiments", "/docs/archive", "/docs/media", "/.github"]

[[bin]]
name = "h3"
path = "src/bin/h3/main.rs"
doc = false
required-features = ["cli"]

[features]
default = ["cli", "prompt-generation"]
# Disable default features when consuming only the library.
cli = ["dep:anyhow", "dep:clap"]
local-prompt-generation = ["prompt-generation"]
prompt-generation = ["dep:reqwest", "dep:base64", "dep:png", "dep:regex"]
# One stage of the pipeline at a time, for comparing against a reference or a previous kernel.
[[bin]]
name = "h3-dev"
path = "src/bin/h3-dev/main.rs"
doc = false

[dependencies]
hrx = { package = "hrx-rs", version = "0.8.7" }
half = { version = "2", features = ["bytemuck"] }
bytemuck = "1"
thiserror = "2"
safetensors = "0.8"
serde_json = "1"
tempfile = "3"
# Use the Rust regex backend without a native regex dependency.
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
# ChaCha rather than StdRng: rand does not promise StdRng's stream across major versions, and a seed
# has to keep naming the same clip.
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_chacha = "0.9"
rand_distr = "0.5"
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"], optional = true }
base64 = { version = "0.22", optional = true }
png = { version = "0.18", optional = true }
regex = { version = "1", optional = true }

[dev-dependencies]
libm = "0.2"

[profile.release]
opt-level = 2
