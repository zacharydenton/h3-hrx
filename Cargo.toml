# One workspace: the crates share a lockfile, a target directory and one `cargo test`.
#
# examples/rust is deliberately excluded. It is a client, and building it the way someone outside this
# repository would — its own lockfile, resolved against the crate as published — is the point of it.
[workspace]
resolver = "2"
members = ["h3", "cli"]
exclude = ["examples/rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 2

[workspace.dependencies]
hrx = { git = "https://github.com/zacharydenton/hrx.rs", rev = "a440e8b23586b1ae88e0f4cb616f8d6755d766dc", default-features = false, features = ["download", "ffi", "loom"] }
