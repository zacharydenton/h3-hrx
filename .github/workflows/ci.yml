name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU checks and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      HRX_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Formatting, lint, and CPU tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --no-default-features --features cli,prompt-generation
      - name: Library without CLI dependencies
        run: cargo check --locked --no-default-features
      - name: Rust consumer
        run: cargo check --locked --manifest-path clients/rust/Cargo.toml
      - name: Rustler consumer
        run: cargo check --locked --manifest-path clients/rustler/Cargo.toml
      - name: API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Verify source package against pinned HRX
        run: |
          read -r hrx_git hrx_rev < <(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "h3-hrx") | .dependencies[] | select(.name == "hrx-rs") | .source | ltrimstr("git+") | split("?rev=") | @tsv'
          )
          # Cargo packages replace Git dependencies with registry versions.
          cargo package --locked \
            --config "patch.crates-io.hrx-rs.git=\"$hrx_git\"" \
            --config "patch.crates-io.hrx-rs.rev=\"$hrx_rev\""
