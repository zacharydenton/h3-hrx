[package]
name = "h3"
version.workspace = true
edition.workspace = true
description = "MiniMax H3 inference: ComfyUI checkpoints in, video and audio out, every kernel in Loom"

[lib]
path = "src/lib.rs"
# rlib for cli/ and the examples, cdylib for everyone reaching the C ABI
crate-type = ["rlib", "cdylib"]

[features]
# The implementation modules, for the diagnostic examples in examples/. Not a stable interface.
internals = []

[dependencies]
hrx = { path = "../hrx" }
memmap2 = "0.9"
safetensors = "0.8"
half = "2"
libc = "0.2"
thiserror = "2"
# fancy-regex, not onig: onig is a C library, and the point of this crate is that there is no C.
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "1.0.0", default-features = false, features = ["blocking", "rustls-tls"] }
# ChaCha rather than StdRng: rand does not promise StdRng's stream across major versions, and a seed
# has to keep naming the same clip.
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_chacha = "0.9"
rand_distr = "0.5"

[dev-dependencies]
tempfile = "3"

# The diagnostic drivers reach into the implementation, so they say so.
