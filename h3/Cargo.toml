[package]
name = "h3"
version = "0.1.0"
edition = "2021"
description = "MiniMax H3 inference: ComfyUI checkpoints in, video and audio out, every kernel in Loom"

[lib]
path = "src/lib.rs"

[dependencies]
hrx = { path = "../hrx" }
memmap2 = "0.9"
safetensors = "0.8"
half = "2"
libc = "0.2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
